name: Publish
# Publish the workspace's publishable crates to crates.io on a version tag. One
# `dx release <spec> --push` cuts the tag that fires this.
#
# Which crates go up and in what order is `cargo publish --workspace`, which
# reads both off the manifests — `publish = false` members (xtask) are skipped,
# and uploads are ordered so `usvg-flatten` precedes `resvg-swift`, which
# depends on it. A run that died partway is finished by naming what already
# went up:
#
#     cargo publish --workspace --exclude usvg-flatten
#
# Auth is the `CARGO_REGISTRY_TOKEN` secret, as in every other diaryx-org repo
# that publishes. It must carry `publish-new` for the first release of each
# crate, and `publish-update` after. Setting it is a repo-settings edit
# (`gh secret set CARGO_REGISTRY_TOKEN`) and nothing here changes.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2

    # On a tag, the tag must name the version being published — refuse a
    # mismatch rather than publish a surprise. (workflow_dispatch has no tag, so
    # the guard is skipped there.)
    - name: Check the tag against the workspace version
      if: github.ref_type == 'tag'
      run: |
        version=$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[] | select(.name == "usvg-flatten") | .version')
        echo "Workspace version: $version"
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
          exit 1
        fi

    - name: Publish every publishable crate, in dependency order
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish --workspace
