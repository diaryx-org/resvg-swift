name: CI
# `cargo xtask ci` is the definition of green; this file only decides where it
# runs. The Rust jobs run on Linux — the committed UniFFI binding is arch-neutral
# source, so its drift check needs no Mac. Its last job fetches resvg's test
# suite (a 24 MB sparse clone of the resvg repo at the pinned tag) and renders
# all ~1,700 cases both ways; that is the one network access. The Swift package
# needs a Mac, so its tests run on a macOS runner against the staticlib the
# script builds.
on:
  push: { branches: [main] }
  pull_request: null
  workflow_dispatch: null

# Cancel superseded runs on the same ref — a new push makes the old one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # rust-toolchain.toml names the toolchain; rustup installs it on first use.
    - uses: Swatinem/rust-cache@v2
    - run: cargo xtask ci

  swift:
    name: Swift package tests
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - run: bash scripts/test-swift.sh
