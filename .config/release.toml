# What the shared release tooling needs to know about resvg-swift. Everything
# not stated here is a default in lib/repo.nu — the manifest, the changelog
# path, the cliff config, and that this is a Cargo workspace.
name = "resvg-swift"
url = "https://github.com/diaryx-org/resvg-swift"
release_branch = "main"

# What to run before cutting. Each repo owns its own CI; this names it.
verify = "cargo xtask ci"

# What pushing the tag sets off, most consequential first. The warning printed
# before the push is handed back to you is composed from these.
[[tag_starts]]
workflow = "publish.yml"
does = "uploads usvg-flatten and resvg-uniffi to crates.io"
